// Chaquopy Python configuration — applied from build.gradle.kts
// Groovy DSL used because Chaquopy's Kotlin DSL extensions aren't available at compile time.

android.defaultConfig.python {
    version "3.11"
    buildPython "/opt/homebrew/bin/python3.11"

    pip {
        install "werkzeug"
        install "click"
        install "jinja2"
        install "markupsafe"
        install "python-dateutil"
        install "pytz"
        install "six"
        install "semantic-version"
        install "charset-normalizer"
        install "cryptography"
        install "pyjwt"
        install "requests"
        install "gitpython"
        install "git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2"
        install "typing_extensions"
        install "bleach-allowlist"
        install "pydantic==1.10.21"
        install "filetype"
        install "filelock"
        install "tenacity"
        install "croniter"
        install "cssutils"
        install "beautifulsoup4"
        install "pypdf"
        install "pdfkit"
        install "markdown2"
        install "bleach"
        install "passlib"
        install "phonenumbers"
        install "pycountry"
        install "sqlparse"
        install "sql-metadata"
        install "packaging"
        install "pyotp"
        install "pyyaml"
        install "oauthlib"
        install "babel"
        install "restrictedpython"
        install "whoosh"
        install "traceback-with-variables"
        install "tzdata"
        install "terminaltables"
        install "num2words"
        install "vobject"
        install "zxcvbn"
        install "chardet"
        install "html5lib"
        install "openpyxl"
        install "xlrd"
        install "xlsxwriter"
        install "email-reply-parser"
        install "markdownify"
        install "posthog"
    }

    // Source dirs default to app/src/main/python/ — symlinks are set up there
}
